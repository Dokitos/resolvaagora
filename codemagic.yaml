workflows:
  # Corre em cada push — só compila (sem assinatura) para confirmar que o
  # projeto iOS continua válido. Não precisa de conta Apple Developer.
  ios-build-verify:
    name: iOS - Build de verificação (sem assinatura)
    max_build_duration: 30
    instance_type: mac_mini_m2
    working_directory: mobile-technician
    environment:
      flutter: stable
      xcode: latest
      cocoapods: default
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: main
          include: true
    scripts:
      - name: Get Flutter packages
        script: flutter pub get
      - name: Gerar localizacao
        script: flutter gen-l10n
      - name: Build iOS (sem assinatura)
        script: flutter build ios --release --no-codesign
    artifacts:
      - build/ios/iphoneos/*.app

  # Workflow de distribuição — só funciona depois de:
  #   1. Criar conta Apple Developer Program (developer.apple.com)
  #   2. Ligar essa conta ao Codemagic (Teams > Integrations > Apple Developer Portal)
  #   3. Configurar `app_store_connect` + `ios_signing` nas Codemagic UI env vars
  #      (App Store Connect API key + grupo de certificados)
  # Depois disso, ativar o trigger abaixo e o publishing.
  ios-release:
    name: iOS - Build assinado + TestFlight
    max_build_duration: 60
    instance_type: mac_mini_m2
    working_directory: mobile-technician
    environment:
      flutter: stable
      xcode: latest
      cocoapods: default
      ios_signing:
        distribution_type: app_store
        bundle_identifier: pt.resolvaagora.app
      vars:
        APP_STORE_APPLE_ID: 0 # substituir pelo Apple ID numérico da app depois de criada em App Store Connect
    triggering:
      events:
        - tag
      tag_patterns:
        - pattern: "ios-v*"
          include: true
    scripts:
      - name: Get Flutter packages
        script: flutter pub get
      - name: Gerar localizacao
        script: flutter gen-l10n
      - name: Set up code signing
        script: xcode-project use-profiles
      - name: Build IPA assinado
        script: |
          flutter build ipa --release \
            --dart-define=API_URL=https://api.resolvaagora.pt/api/v1 \
            --export-options-plist=/Users/builder/export_options.plist
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    # Publishing para o TestFlight desativado por agora: precisa de uma
    # integração "App Store Connect" ligada em Teams > Integrations (só
    # possível depois de teres conta Apple Developer). Quando a ligares,
    # acrescenta a chave "integrations" ao nível do workflow (irmã de
    # "scripts"/"publishing" acima) com o nome que deres à integração no
    # Codemagic, e descomenta o bloco publishing abaixo:
    # integrations:
    #   app_store_connect: nome_da_integracao
    # publishing:
    #   app_store_connect:
    #     auth: integration
    #     submit_to_testflight: true

  # Workflow de distribuição Android — só funciona depois de:
  #   1. Na Codemagic (Teams > Code signing identities > Android), fazer
  #      upload do keystore de release (resolvaagora-upload.keystore) com a
  #      referência "resolvaagora_keystore" (ou muda o nome abaixo em
  #      android_signing para o que usares no upload).
  #   2. Criar uma conta de serviço no Google Cloud com acesso à Play Console
  #      (Play Console > Utilizadores e autorizações > Convidar utilizador,
  #      permissões de gestão de versões) e gerar a chave JSON dessa conta.
  #   3. Nesta app, em Application settings > Environment variables, criar a
  #      variável GOOGLE_PLAY_SERVICE_ACCOUNT_CREDENTIALS = conteúdo do
  #      ficheiro JSON da conta de serviço (marcar "Secret").
  #   4. A app tem de já ter sido submetida manualmente à Play Console pelo
  #      menos uma vez (a API não cria a ficha da app, só publica versões).
  # Depois disso, cada push a "main" gera um app bundle assinado e publica-o
  # automaticamente na faixa de testes interna da Play Store.
  android-release:
    name: Android - Build assinado + Play Store (testes internos)
    max_build_duration: 60
    instance_type: linux_x2
    working_directory: mobile-technician
    environment:
      flutter: stable
      groups:
        - android-release
      android_signing:
        - resolvaagora_keystore
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: main
          include: true
    scripts:
      - name: Get Flutter packages
        script: flutter pub get
      - name: Gerar localizacao
        script: flutter gen-l10n
      - name: Escrever google-services.json
        script: echo "$GOOGLE_SERVICES_JSON" > android/app/google-services.json
      - name: Escrever key.properties (assinatura de release)
        script: |
          cat > android/key.properties <<EOF
          storeFile=$CM_KEYSTORE_PATH
          storePassword=$CM_KEYSTORE_PASSWORD
          keyAlias=$CM_KEY_ALIAS
          keyPassword=$CM_KEY_PASSWORD
          EOF
      - name: Calcular numero de build (Play Store + 1)
        script: |
          LATEST_BUILD_NUMBER=$(google-play get-latest-build-number \
            --package-name "pt.resolvaagora.app" \
            --credentials=@env:GOOGLE_PLAY_SERVICE_ACCOUNT_CREDENTIALS || echo "")
          if [ -z "$LATEST_BUILD_NUMBER" ]; then
            LATEST_BUILD_NUMBER=0
          fi
          echo "BUILD_NUMBER=$(($LATEST_BUILD_NUMBER + 1))" >> $CM_ENV
      - name: Build app bundle assinado
        script: |
          flutter build appbundle --release \
            --build-number=$BUILD_NUMBER \
            --dart-define=API_URL=https://api.resolvaagora.pt/api/v1
    artifacts:
      - build/app/outputs/bundle/release/*.aab
    publishing:
      google_play:
        credentials: $GOOGLE_PLAY_SERVICE_ACCOUNT_CREDENTIALS
        track: internal
