workflows:
  # Corre em cada push a main que altere algo dentro de mobile-technician/ —
  # só compila (sem assinatura) para confirmar que o projeto iOS continua
  # válido. Não precisa de conta Apple Developer. Alterações só no backend/
  # ou frontend-web/ não disparam este build (ver "when: changeset" abaixo).
  ios-build-verify:
    name: iOS - Build de verificação (sem assinatura)
    max_build_duration: 30
    instance_type: mac_mini_m2
    working_directory: mobile-technician
    environment:
      flutter: stable
      xcode: latest
      cocoapods: default
      groups:
        - ios-firebase
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: main
          include: true
    when:
      changeset:
        includes:
          - 'mobile-technician/'
    scripts:
      - name: Get Flutter packages
        script: flutter pub get
      - name: Gerar localizacao
        script: flutter gen-l10n
      - name: Escrever GoogleService-Info.plist
        script: echo "$GOOGLE_SERVICE_INFO_PLIST" | base64 --decode > ios/Runner/GoogleService-Info.plist
      - name: Build iOS (sem assinatura)
        script: flutter build ios --release --no-codesign
    artifacts:
      - build/ios/iphoneos/*.app

  # Workflow de distribuição iOS. Dispara com uma tag "ios-v*" (não com push),
  # para o envio para o TestFlight ser sempre um ato deliberado.
  # Pré-requisitos, todos já do lado da Codemagic UI:
  #   1. Teams > Integrations > App Store Connect: ligar a chave da API do
  #      App Store Connect com o nome EXATO "resolvaagora_app_store".
  #   2. Application settings > Environment variables > grupo "ios-firebase":
  #      - GOOGLE_SERVICE_INFO_PLIST = GoogleService-Info.plist do Firebase em
  #        base64, marcado "Secret". (O mesmo grupo é usado pelo
  #        ios-build-verify, porque o plist passou a ser um recurso do build.)
  #      - CERTIFICATE_PRIVATE_KEY = chave RSA privada em PEM, marcada
  #        "Secret". É com ela que o fetch-signing-files cria o certificado de
  #        distribuição na Apple; guardar o .pem fora do repositório, porque
  #        perdê-la obriga a revogar o certificado e a criar tudo de novo.
  ios-release:
    name: iOS - Build assinado + TestFlight
    max_build_duration: 60
    instance_type: mac_mini_m2
    working_directory: mobile-technician
    integrations:
      app_store_connect: resolvaagora_app_store
    environment:
      flutter: stable
      xcode: latest
      cocoapods: default
      groups:
        - ios-firebase
      vars:
        APP_STORE_APPLE_ID: 6804067347
        BUNDLE_ID: pt.resolvaagora.app
    triggering:
      events:
        - tag
      tag_patterns:
        - pattern: "ios-v*"
          include: true
    scripts:
      - name: Get Flutter packages
        script: flutter pub get
      - name: Gerar localizacao
        script: flutter gen-l10n
      - name: Escrever GoogleService-Info.plist
        script: echo "$GOOGLE_SERVICE_INFO_PLIST" | base64 --decode > ios/Runner/GoogleService-Info.plist
      # A conta Apple é nova: não há certificado de distribuição nem perfil
      # para este bundle ID. O --create cria ambos (e é idempotente nas
      # builds seguintes, que passam a reutilizá-los).
      - name: Set up code signing
        script: |
          keychain initialize
          app-store-connect fetch-signing-files "$BUNDLE_ID" \
            --type IOS_APP_STORE \
            --create
          keychain add-certificates
          xcode-project use-profiles
      # A Apple rejeita uploads com um build number já usado. Tal como no
      # Android, o número vem do que já lá está (+1) em vez do pubspec.yaml,
      # senão cada tag nova exigia editar o ficheiro à mão.
      - name: Calcular numero de build (TestFlight + 1)
        script: |
          LATEST_BUILD_NUMBER=$(app-store-connect get-latest-testflight-build-number \
            "$APP_STORE_APPLE_ID" || echo "")
          if [ -z "$LATEST_BUILD_NUMBER" ]; then
            LATEST_BUILD_NUMBER=0
          fi
          echo "BUILD_NUMBER=$(($LATEST_BUILD_NUMBER + 1))" >> $CM_ENV
      - name: Build IPA assinado
        script: |
          flutter build ipa --release \
            --build-number=$BUILD_NUMBER \
            --dart-define=API_URL=https://api.resolvaagora.pt/api/v1 \
            --export-options-plist=/Users/builder/export_options.plist
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true

  # Workflow de distribuição Android — só funciona depois de:
  #   1. Na Codemagic (Teams > Code signing identities > Android), fazer
  #      upload do keystore de release (resolvaagora-upload.keystore) com a
  #      referência "resolvaagora_keystore" (ou muda o nome abaixo em
  #      android_signing para o que usares no upload).
  #   2. Criar uma conta de serviço no Google Cloud com acesso à Play Console
  #      (Play Console > Utilizadores e autorizações > Convidar utilizador,
  #      permissões de gestão de versões) e gerar a chave JSON dessa conta.
  #   3. Nesta app, em Application settings > Environment variables, criar a
  #      variável GOOGLE_PLAY_SERVICE_ACCOUNT_CREDENTIALS = conteúdo do
  #      ficheiro JSON da conta de serviço (marcar "Secret").
  #   4. A app tem de já ter sido submetida manualmente à Play Console pelo
  #      menos uma vez (a API não cria a ficha da app, só publica versões).
  # Dispara com uma tag "android-v*", tal como o iOS dispara com "ios-v*".
  # Antes corria a cada push que tocasse em mobile-technician/, o que gerava e
  # publicava uma versão na Play Store por commit — caro e sem utilidade, já
  # que a maior parte dos commits não é para distribuir.
  android-release:
    name: Android - Build assinado + Play Store (testes internos)
    max_build_duration: 60
    instance_type: linux_x2
    working_directory: mobile-technician
    environment:
      flutter: stable
      groups:
        - android-release
      android_signing:
        - resolvaagora_keystore
    triggering:
      events:
        - tag
      tag_patterns:
        - pattern: "android-v*"
          include: true
    scripts:
      - name: Get Flutter packages
        script: flutter pub get
      - name: Gerar localizacao
        script: flutter gen-l10n
      - name: Escrever google-services.json
        script: echo "$GOOGLE_SERVICES_JSON" > android/app/google-services.json
      - name: Escrever key.properties (assinatura de release)
        script: |
          cat > android/key.properties <<EOF
          storeFile=$CM_KEYSTORE_PATH
          storePassword=$CM_KEYSTORE_PASSWORD
          keyAlias=$CM_KEY_ALIAS
          keyPassword=$CM_KEY_PASSWORD
          EOF
      - name: Calcular numero de build (Play Store + 1)
        script: |
          LATEST_BUILD_NUMBER=$(google-play get-latest-build-number \
            --package-name "pt.resolvaagora.app" \
            --credentials=@env:GOOGLE_PLAY_SERVICE_ACCOUNT_CREDENTIALS || echo "")
          if [ -z "$LATEST_BUILD_NUMBER" ]; then
            LATEST_BUILD_NUMBER=0
          fi
          echo "BUILD_NUMBER=$(($LATEST_BUILD_NUMBER + 1))" >> $CM_ENV
      - name: Build app bundle assinado
        script: |
          flutter build appbundle --release \
            --build-number=$BUILD_NUMBER \
            --dart-define=API_URL=https://api.resolvaagora.pt/api/v1
    artifacts:
      - build/app/outputs/bundle/release/*.aab
    publishing:
      google_play:
        credentials: $GOOGLE_PLAY_SERVICE_ACCOUNT_CREDENTIALS
        track: internal
